<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MasterColorMixer</title>
    <script src="/static/app.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 1.5rem;
            margin: 0;
            color: #222;
            background-image: url("/images/grey-marbling.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-color: #cccccc; /* fallback color if the image fails to load */
        }

        h1 {
            margin: 0 0 1rem 0;
            font-size: 2.2rem;
            text-align: center;
        }

        h2 {
            margin: 0 0 0.75rem 0;
            font-size: 1.5rem;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 960px;
            margin: 0 auto;
        }

        /* card container */
        .panel {
            background: #ffffff;
            border-radius: 20px;
            padding: 1rem 1.5rem 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        /* palette panel */
        #palette {
            width: 100%; 
            max-width: 100%; 
            box-sizing: border-box; 
            padding: 8px; 
            display: block; /* JS will switch to grid when it runs */
            align-self: stretch;
        }

        .panel-palette {
            min-height: 190px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        #clearPaletteBtn {
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background: #f44336;
            color: #ffffff;
            min-width: 130px;
        }

            #clearPaletteBtn:focus-visible {
                outline: 3px solid #000;
                outline-offset: 2px;
            }

        /* palette bubbles */
        .palette-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding: 0.25rem 0;
            align-items: center;
        }

        .color-bubble {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            box-sizing: border-box;
            outline: none;
            /* keep a fallback square before JS runs */
            aspect-ratio: 1 / 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            /* subtle visual */
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
            transition: transform .08s ease;
        }
            .color-bubble:active {
                transform: scale(.98);
            }

            .color-bubble > span {
                display: inline-block;
                pointer-events: none;
                padding: 4px;
                line-height: 1;
            }

        /* mixing bowl */
        #mix-header {
            display: flex;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        #mix-buttons {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 0.75rem 1.6rem;
            border-radius: 999px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }

        #mixBtn {
            background: #4caf50;
            color: #ffffff;
        }

        #clearBowlBtn {
            background: #ffc107;
            color: #222;
        }

        .action-btn:focus-visible {
            outline: 3px solid #000;
            outline-offset: 2px;
        }

        .mix-bowl-wrapper {
            background: #ffe9c7;
            border-radius: 24px;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 210px;
        }

        .mix-bowl {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        .mix-slot {
            width: 140px;
            height: 140px;
            border-radius: 999px;
            border: 3px dashed #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            background: #fafafa;
            text-align: center;
            padding: 0.5rem;
        }

            .mix-slot.filled {
                border-style: solid;
                color: #111;
            }

                .mix-slot.filled span {
                    pointer-events: none;
                }

        #status {
            margin-top: 0.9rem;
            font-size: 1.05rem;
            min-height: 1.4em;
            text-align: center;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .mix-bowl {
                gap: 1.2rem;
            }

            .mix-slot {
                width: 120px;
                height: 120px;
            }
        }

        /* ensure the mixing slot elements don't force the palette to layout incorrectly */
        #slotA, #slotB {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>MasterColorMixer</h1>
    <main>
        <!--- Color Palette --->
        <section class="panel panel-palette" aria-label="Color palette">
            <div class="panel-header">
                <h2>Palette</h2>
                <button id="clearPaletteBtn"
                        type="button"
                        aria-label="Reset palette to starting colors">
                    Reset Palette
                </button>
            </div>

            <!--- JS injected color circles --->
            <div id="palette"
                 class="palette-grid"
                 role="list"
                 aria-label="Available colors">
            </div>
        </section>

        <!--- Mixing Bowl --->
        <section id="mix-section" class="panel" aria-label="Mixing bowl">
            <div id="mix-header">
                <h2>Mixing Bowl</h2>
            </div>

            <div id="mix-buttons">
                <button id="mixBtn" class="action-btn" type="button">
                    Mix
                </button>
                <button id="clearBowlBtn" class="action-btn" type="button">
                    Clear
                </button>
            </div>

            <div class="mix-bowl-wrapper">
                <div class="mix-bowl" aria-label="Mixing slots">
                    <div id="slotA"
                         class="mix-slot"
                         data-slot="A"
                         aria-label="First color slot">
                        Slot A
                    </div>
                    <div id="slotB"
                         class="mix-slot"
                         data-slot="B"
                         aria-label="Second color slot">
                        Slot B
                    </div>
                </div>
            </div>

            <div id="status" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
