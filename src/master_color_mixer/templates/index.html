<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MasterColorMixer</title>

    <!-- Confetti library for reward effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- App script -->
    <script src="/static/app.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 1.5rem;
            margin: 0;
            color: #222;
            background-image: url("/images/grey-marbling.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-color: #cccccc; /* fallback color if the image fails to load */
        }

        h1 {
            margin: 0 0 1rem 0;
            font-size: 2.2rem;
            text-align: center;
        }

        h2 {
            margin: 0 0 0.75rem 0;
            font-size: 1.5rem;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 960px;
            margin: 0 auto;
        }

        /* card container */
        .panel {
            background: #ffffff;
            border-radius: 20px;
            padding: 1rem 1.5rem 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        /* palette panel */
        .panel-palette {
            min-height: 260px; /* more vertical space for bubbles + mystery colors */
        }

        #palette {
            width: 100%;
            max-width: 100%;
            padding: 8px;
            display: block; /* JS switches to grid when it runs */
            align-self: stretch;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 0.5rem;
        }

        .palette-controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-start;
            justify-content: flex-start;
            min-width: 120px; /* similar width to mix-controls */
        }

        /* row that holds controls on the left and palette on the right */
        .palette-layout {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
        }

        /* area where palette bubbles sit */
        .palette-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
        }

        #palette {
            width: 100%;
        }

        #clearPaletteBtn {
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background: #f44336;
            color: #ffffff;
            min-width: 130px;
        }

            #clearPaletteBtn:focus-visible {
                outline: 3px solid #000;
                outline-offset: 2px;
            }

        /* palette bubbles */
        .palette-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding: 0.25rem 0;
            align-items: center;
        }

        .color-bubble {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            box-sizing: border-box;
            outline: none;
            aspect-ratio: 1 / 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
            transition: transform .08s ease;
        }

            .color-bubble:active {
                transform: scale(.98);
            }

            .color-bubble > span {
                display: inline-block;
                pointer-events: none;
                padding: 4px;
                line-height: 1;
            }

        /* mixing bowl section */
        #mix-header {
            display: flex;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .mix-layout {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        #mix-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: flex-start;
            justify-content: flex-start;
            min-width: 120px;
        }

        .action-btn {
            padding: 0.75rem 1.6rem;
            border-radius: 999px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }

        #mixBtn {
            background: #4caf50;
            color: #ffffff;
        }

        #clearBowlBtn {
            background: #ffc107;
            color: #222;
        }

        .action-btn:focus-visible {
            outline: 3px solid #000;
            outline-offset: 2px;
        }

        .mix-bowl-wrapper {
            background: #ffe9c7;
            border-radius: 24px;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 210px;
            flex: 1;
        }

        .mix-bowl {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        .mix-slot {
            width: 140px;
            height: 140px;
            border-radius: 999px;
            border: 3px dashed #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            background: #fafafa;
            text-align: center;
            padding: 0.5rem;
        }

            .mix-slot.filled {
                border-style: solid;
                color: #111;
            }

                .mix-slot.filled span {
                    pointer-events: none;
                }

        #status {
            margin-top: 0.9rem;
            font-size: 1.05rem;
            min-height: 1.4em;
            text-align: center;
        }

        /* Mystery color area under Reset */
        #mystery-colors {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

            #mystery-colors .color-bubble {
                width: 52px;
                height: 52px;
                border-radius: 50%;
            }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .mix-layout {
                flex-direction: column;
                align-items: stretch;
            }

            .mix-bowl-wrapper {
                width: 100%;
            }

            .mix-bowl {
                gap: 1.2rem;
            }

            .mix-slot {
                width: 120px;
                height: 120px;
            }
        }

        /* ensure the mixing slot elements don't force the palette to layout incorrectly */
        #slotA, #slotB {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>MasterColorMixer</h1>

    <main>
        <!-- Color Palette -->
        <section class="panel panel-palette" aria-label="palette">
            <!-- Header row just for the title -->
            <div class="panel-header">
                <h2>Color Palette</h2>
            </div>

            <!-- Layout row: left controls, right palette area -->
            <div class="palette-layout">
                <!-- Reset + mystery colors column (mirrors mix-controls) -->
                <div class="palette-controls" aria-label="Palette controls">
                    <button id="clearPaletteBtn"
                            type="button"
                            aria-label="Reset palette to starting colors">
                        Reset Palette
                    </button>

                    <!-- Mystery colors (do not count toward palette capacity) -->
                    <div id="mystery-colors" aria-label="Mystery colors">
                        <!-- top mystery circle: becomes black when unlocked -->
                        <button id="mystery-black"
                                class="color-bubble"
                                type="button"
                                aria-label="Mystery color 1">
                            <span>?</span>
                        </button>
                        <!-- bottom mystery circle: becomes white when unlocked -->
                        <button id="mystery-white"
                                class="color-bubble"
                                type="button"
                                aria-label="Mystery color 2">
                            <span>?</span>
                        </button>
                    </div>
                </div>

                <!-- Palette bubbles area -->
                <div class="palette-wrapper">
                    <!-- JS-injected color circles -->
                    <div id="palette"
                         class="palette-grid"
                         role="list"
                         aria-label="Available colors">
                    </div>
                </div>
            </div>
        </section>

        <!-- Mixing Bowl -->
        <section id="mix-section" class="panel" aria-label="Mixing bowl">
            <div id="mix-header">
                <h2>Mixing Bowl</h2>
            </div>

            <div class="mix-layout">
                <!-- Controls on the left -->
                <div id="mix-controls" aria-label="Mixing controls">
                    <button id="mixBtn" class="action-btn" type="button">
                        Mix
                    </button>
                    <button id="clearBowlBtn" class="action-btn" type="button">
                        Clear
                    </button>
                </div>

                <!-- Large beige drop zone for the mixing bowl -->
                <div class="mix-bowl-wrapper" aria-label="Drop colors here to mix">
                    <div class="mix-bowl" aria-label="Mixing slots">
                        <div id="slotA"
                             class="mix-slot"
                             data-slot="A"
                             aria-label="First color slot">
                        </div>
                        <div id="slotB"
                             class="mix-slot"
                             data-slot="B"
                             aria-label="Second color slot">
                        </div>
                    </div>
                </div>
            </div>

            <div id="status" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
